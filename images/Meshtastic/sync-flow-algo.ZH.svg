<svg viewBox="0 0 1220 1320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill:#ffffff; }
    .shape { fill:#ffffff; stroke:#1a1a1a; stroke-width:2; }
    .line { stroke:#1a1a1a; stroke-width:2; fill:none; }
    .arrowhead { fill:#1a1a1a; }
    text { fill:#1a1a1a; font-size:20px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill:#1b1e24; }
      .shape { fill:#1b1e24; stroke:#e5e7eb; }
      .line { stroke:#e5e7eb; }
      .arrowhead { fill:#e5e7eb; }
      text { fill:#e5e7eb; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="1320" class="bg"/>

  <!-- 开始 -->
  <rect x="480" y="20" width="250" height="100" rx="35" class="shape"/>
  <text x="605" y="78" text-anchor="middle">开始</text>

  <!-- 说明：每次轮询只使用一个节点——第一个应答者 -->
  <rect x="70" y="140" width="360" height="86" rx="10" class="shape" stroke-dasharray="5 4"/>
  <text x="250" y="168" text-anchor="middle" font-size="14" font-style="italic">第 1 轮 SYNC_REQ 是广播的，</text>
  <text x="250" y="189" text-anchor="middle" font-size="14" font-style="italic">但只使用第一个应答；</text>
  <text x="250" y="210" text-anchor="middle" font-size="14" font-style="italic">它也会成为本次轮询中其余信区的应答对象</text>

  <!-- D1 -->
  <polygon points="605,210 770,300 605,390 440,300" class="shape"/>
  <text x="605" y="294" text-anchor="middle">听到邻居</text>
  <text x="605" y="317" text-anchor="middle">心跳信标？</text>

  <!-- Box1 -->
  <rect x="140" y="250" width="240" height="100" class="shape"/>
  <text x="260" y="294" text-anchor="middle">等待</text>
  <text x="260" y="317" text-anchor="middle">下一个周期</text>

  <!-- D2 -->
  <polygon points="605,440 770,530 605,620 440,530" class="shape"/>
  <text x="605" y="524" text-anchor="middle">邻居是新出现</text>
  <text x="605" y="547" text-anchor="middle">还是重新出现？</text>

  <!-- Box2 -->
  <rect x="850" y="480" width="250" height="100" class="shape"/>
  <text x="975" y="524" text-anchor="middle">更新</text>
  <text x="975" y="547" text-anchor="middle">最后活跃时间</text>

  <!-- D3 -->
  <polygon points="605,670 770,760 605,850 440,760" class="shape"/>
  <text x="605" y="754" text-anchor="middle">该节点在本轮</text>
  <text x="605" y="777" text-anchor="middle">轮询中已应答？</text>

  <!-- Box3 -->
  <rect x="100" y="695" width="290" height="130" class="shape"/>
  <text x="245" y="746" text-anchor="middle">SYNC_REQ 第 1 轮 —</text>
  <text x="245" y="769" text-anchor="middle">广播 ^all，</text>
  <text x="245" y="792" text-anchor="middle">无 ACK/重传</text>

  <!-- D4 -->
  <polygon points="605,900 770,990 605,1080 440,990" class="shape"/>
  <text x="605" y="984" text-anchor="middle">所有消息</text>
  <text x="605" y="1007" text-anchor="middle">是否都已收到？</text>

  <!-- Box4 -->
  <rect x="820" y="920" width="280" height="140" class="shape"/>
  <text x="960" y="971" text-anchor="middle">SYNC_REQ/GET_DATA —</text>
  <text x="960" y="994" text-anchor="middle">定向，分轮</text>
  <text x="960" y="1017" text-anchor="middle">ACK/重传；消息 → 数据库</text>
  <text x="960" y="1040" text-anchor="middle">→ 页脚计数器</text>

  <!-- 结束 -->
  <rect x="480" y="1180" width="250" height="100" rx="35" class="shape"/>
  <text x="605" y="1238" text-anchor="middle">结束</text>

  <!-- 主纵向流程线 -->
  <line x1="605" y1="120" x2="605" y2="200" class="line" marker-end="url(#arrow)"/>
  <line x1="605" y1="390" x2="605" y2="430" class="line" marker-end="url(#arrow)"/>
  <text x="635" y="418" font-size="18">是</text>
  <line x1="605" y1="620" x2="605" y2="660" class="line" marker-end="url(#arrow)"/>
  <text x="635" y="648" font-size="18">是</text>
  <line x1="605" y1="850" x2="605" y2="890" class="line" marker-end="url(#arrow)"/>
  <text x="635" y="878" font-size="18">是</text>
  <line x1="605" y1="1080" x2="605" y2="1170" class="line" marker-end="url(#arrow)"/>
  <text x="635" y="1133" font-size="18">是</text>

  <!-- 否：菱形 -> 侧边矩形 -->
  <line x1="440" y1="300" x2="390" y2="300" class="line" marker-end="url(#arrow)"/>
  <text x="405" y="284" font-size="18">否</text>

  <line x1="770" y1="530" x2="840" y2="530" class="line" marker-end="url(#arrow)"/>
  <text x="800" y="514" font-size="18">否</text>

  <line x1="440" y1="760" x2="400" y2="760" class="line" marker-end="url(#arrow)"/>
  <text x="410" y="744" font-size="18">否</text>

  <line x1="770" y1="990" x2="810" y2="990" class="line" marker-end="url(#arrow)"/>
  <text x="785" y="974" font-size="18">否</text>

  <!-- 左侧返回主线：Box1 和 Box3 -->
  <line x1="140" y1="300" x2="40" y2="300" class="line"/>
  <line x1="100" y1="760" x2="40" y2="760" class="line"/>
  <line x1="40" y1="300" x2="40" y2="70" class="line"/>
  <line x1="40" y1="760" x2="40" y2="300" class="line"/>
  <line x1="40" y1="70" x2="480" y2="70" class="line" marker-end="url(#arrow)"/>

  <!-- 右侧返回主线：Box2 和 Box4 -->
  <line x1="1100" y1="530" x2="1170" y2="530" class="line"/>
  <line x1="1100" y1="990" x2="1170" y2="990" class="line"/>
  <line x1="1170" y1="530" x2="1170" y2="70" class="line"/>
  <line x1="1170" y1="990" x2="1170" y2="530" class="line"/>
  <line x1="1170" y1="70" x2="730" y2="70" class="line" marker-end="url(#arrow)"/>
</svg>
