<svg viewBox="0 0 1040 950" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .card { fill:#f7f8fa; stroke:#d7dbe0; }
    .link { stroke:#14b8a6; }
    .link-label { fill:#0f766e; }
    .node-label { fill:#ffffff; font-weight:600; }
    .sub-label { fill:#5b6472; }
    .note { fill:#5b6472; font-style:italic; }
    .legend-text { fill:#3a4150; }
    .client { fill:#2f6fed; }
    .base { fill:#d9822b; }
    .cloud { fill:#94a3b8; }
    .city-box { fill:none; stroke:#94a3b8; stroke-width:2; stroke-dasharray:10 6; }
    .city-label { fill:#3a4150; font-weight:700; }
    .roam { stroke:#e11d48; }
    .roam-label { fill:#be123c; }
    .badge-bg { fill:#0f172a; }
    .badge-text { fill:#ffffff; font-weight:700; }
    @media (prefers-color-scheme: dark) {
      .card { fill:#1b1e24; stroke:#383d46; }
      .link { stroke:#2dd4bf; }
      .link-label { fill:#5eead4; }
      .sub-label { fill:#9aa4b2; }
      .note { fill:#9aa4b2; }
      .legend-text { fill:#c7cdd6; }
      .client { fill:#4f8cff; }
      .base { fill:#f0a94e; }
      .cloud { fill:#6b7280; }
      .city-box { stroke:#5b6472; }
      .city-label { fill:#c7cdd6; }
      .roam { stroke:#fb7185; }
      .roam-label { fill:#fda4af; }
      .badge-bg { fill:#e2e8f0; }
      .badge-text { fill:#14181f; }
    }
    text { font-size:15px; }
  </style>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="link"/>
    </marker>
    <marker id="arrowRoam" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="roam"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1028" height="938" rx="16" class="card" stroke-width="1.5"/>

  <text x="520" y="32" text-anchor="middle" class="note" font-size="13.5">
    Example: two cities with no shared radio range, linked via an MQTT bridge — who gets mail, and how
  </text>

  <!-- Cities -->
  <rect x="30" y="58" width="600" height="560" rx="14" class="city-box"/>
  <text x="330" y="642" text-anchor="middle" class="city-label" font-size="16">City A</text>

  <rect x="656" y="58" width="356" height="560" rx="14" class="city-box"/>
  <text x="834" y="642" text-anchor="middle" class="city-label" font-size="16">City B</text>

  <!-- ── City A: CLIENT_BASE #1 (no internet) and three clients around it ── -->
  <line x1="190" y1="196" x2="190" y2="288" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <line x1="106" y1="330" x2="148" y2="330" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <line x1="190" y1="372" x2="190" y2="464" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>

  <circle cx="190" cy="160" r="36" class="client"/>
  <text x="190" y="165" text-anchor="middle" class="node-label" font-size="13">CLIENT</text>

  <circle cx="70" cy="330" r="36" class="client"/>
  <text x="70" y="335" text-anchor="middle" class="node-label" font-size="13">CLIENT</text>
  <g transform="translate(106,368)">
    <circle r="12" class="badge-bg"/>
    <text y="5" text-anchor="middle" class="badge-text" font-size="13">2</text>
  </g>

  <circle cx="190" cy="500" r="36" class="client"/>
  <text x="190" y="505" text-anchor="middle" class="node-label" font-size="13">CLIENT</text>

  <rect x="148" y="288" width="84" height="84" rx="14" class="base"/>
  <text x="190" y="308" text-anchor="middle" class="node-label" font-size="12.5">CLIENT</text>
  <text x="190" y="323" text-anchor="middle" class="node-label" font-size="12.5">_BASE</text>
  <text x="190" y="339" text-anchor="middle" class="node-label" font-size="10.5">#1</text>
  <text x="190" y="356" text-anchor="middle" class="node-label" font-size="10">offline</text>

  <!-- ── Local LoRa link between the two City A hubs ── -->
  <line x1="232" y1="330" x2="388" y2="330" class="link" stroke-width="3.5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="310" y="316" text-anchor="middle" class="link-label" font-size="12.5" font-weight="600">LoRa</text>
  <text x="310" y="348" text-anchor="middle" class="note" font-size="10.5">auto-sync ~60s</text>

  <!-- ── City A: CLIENT_BASE #2 (with internet) ── -->
  <rect x="388" y="288" width="84" height="84" rx="14" class="base"/>
  <text x="430" y="308" text-anchor="middle" class="node-label" font-size="12.5">CLIENT</text>
  <text x="430" y="323" text-anchor="middle" class="node-label" font-size="12.5">_BASE</text>
  <text x="430" y="339" text-anchor="middle" class="node-label" font-size="10.5">#2</text>
  <text x="430" y="356" text-anchor="middle" class="node-label" font-size="10">online</text>

  <line x1="472" y1="330" x2="524" y2="330" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <circle cx="560" cy="330" r="36" class="client"/>
  <text x="560" y="335" text-anchor="middle" class="node-label" font-size="13">CLIENT</text>

  <line x1="430" y1="288" x2="430" y2="196" class="link" stroke-width="2.5" stroke-dasharray="4 4" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <g class="cloud" opacity="0.9">
    <ellipse cx="422" cy="168" rx="11" ry="7"/>
    <ellipse cx="440" cy="168" rx="11" ry="7"/>
    <ellipse cx="430" cy="160" rx="13" ry="8"/>
  </g>
  <text x="430" y="140" text-anchor="middle" class="link-label" font-size="11" font-weight="600">Internet uplink</text>

  <!-- ── City B: CLIENT_BASE (with internet) and one client ── -->
  <rect x="788" y="288" width="84" height="84" rx="14" class="base"/>
  <text x="830" y="315" text-anchor="middle" class="node-label" font-size="12.5">CLIENT</text>
  <text x="830" y="330" text-anchor="middle" class="node-label" font-size="12.5">_BASE</text>
  <text x="830" y="349" text-anchor="middle" class="node-label" font-size="10">online</text>

  <line x1="830" y1="288" x2="830" y2="196" class="link" stroke-width="2.5" stroke-dasharray="4 4" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <g class="cloud" opacity="0.9">
    <ellipse cx="822" cy="168" rx="11" ry="7"/>
    <ellipse cx="838" cy="168" rx="11" ry="7"/>
    <ellipse cx="830" cy="160" rx="13" ry="8"/>
  </g>
  <text x="830" y="140" text-anchor="middle" class="link-label" font-size="11" font-weight="600">Internet uplink</text>

  <line x1="872" y1="330" x2="924" y2="330" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <circle cx="960" cy="330" r="36" class="client"/>
  <text x="960" y="335" text-anchor="middle" class="node-label" font-size="13">CLIENT</text>
  <g transform="translate(998,290)">
    <circle r="12" class="badge-bg"/>
    <text y="5" text-anchor="middle" class="badge-text" font-size="13">2</text>
  </g>

  <!-- ── MQTT bridge between cities: connects the two internet-uplink clouds ── -->
  <line x1="446" y1="160" x2="812" y2="160" class="link" stroke-width="2.5" stroke-dasharray="2 6" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="629" y="112" text-anchor="middle" class="link-label" font-size="12" font-weight="600">MQTT bridge: mqtt.meshtastic.org</text>
  <text x="629" y="130" text-anchor="middle" class="note" font-size="10.5">same channel and PSK on both boards</text>

  <!-- ── Migrating CLIENT — meets ANY of the three hubs ── -->
  <circle cx="520" cy="800" r="40" class="client"/>
  <text x="520" y="796" text-anchor="middle" class="node-label" font-size="8.5">MIGRATING</text>
  <text x="520" y="812" text-anchor="middle" class="node-label" font-size="12.5">CLIENT</text>
  <g transform="translate(464,800)">
    <circle r="12" class="badge-bg"/>
    <text y="5" text-anchor="middle" class="badge-text" font-size="13">1</text>
  </g>

  <line x1="480" y1="775" x2="210" y2="378" class="roam" stroke-width="2.5" stroke-dasharray="3 3 10 3" marker-end="url(#arrowRoam)"/>
  <line x1="510" y1="762" x2="440" y2="378" class="roam" stroke-width="2.5" stroke-dasharray="3 3 10 3" marker-end="url(#arrowRoam)"/>
  <line x1="558" y1="770" x2="810" y2="378" class="roam" stroke-width="2.5" stroke-dasharray="3 3 10 3" marker-end="url(#arrowRoam)"/>
  <text x="520" y="856" text-anchor="middle" class="roam-label" font-size="12">moves between cities</text>

  <!-- ── Footnotes ── -->
  <g transform="translate(46,886)">
    <circle r="11" class="badge-bg"/>
    <text y="4" text-anchor="middle" class="badge-text" font-size="12">1</text>
  </g>
  <text x="66" y="891" class="legend-text" font-size="12.5">A migrating CLIENT picks up mail from ANY hub that has already replicated it</text>

  <g transform="translate(46,914)">
    <circle r="11" class="badge-bg"/>
    <text y="4" text-anchor="middle" class="badge-text" font-size="12">2</text>
  </g>
  <text x="66" y="919" class="legend-text" font-size="12.5">NETMAIL to this CLIENT in City B travels the same chain (hub#1→hub#2→MQTT→hub) — encrypted, hubs only relay it</text>
</svg>
