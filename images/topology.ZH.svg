<svg viewBox="0 0 980 674" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <style>
    .card { fill:#f7f8fa; stroke:#d7dbe0; }
    .link { stroke:#14b8a6; }
    .link-label { fill:#0f766e; }
    .node-label { fill:#ffffff; font-weight:600; }
    .sub-label { fill:#5b6472; }
    .note { fill:#5b6472; font-style:italic; }
    .legend-text { fill:#3a4150; }
    .client { fill:#2f6fed; }
    .base { fill:#d9822b; }
    .router { fill:#8b5cf6; }
    .cloud { fill:#94a3b8; }
    .tech { fill:#64748b; }
    @media (prefers-color-scheme: dark) {
      .card { fill:#1b1e24; stroke:#383d46; }
      .link { stroke:#2dd4bf; }
      .link-label { fill:#5eead4; }
      .sub-label { fill:#9aa4b2; }
      .note { fill:#9aa4b2; }
      .legend-text { fill:#c7cdd6; }
      .client { fill:#4f8cff; }
      .base { fill:#f0a94e; }
      .router { fill:#a78bfa; }
      .cloud { fill:#6b7280; }
      .tech { fill:#94a3b8; }
    }
    text { font-size:15px; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="link" style="fill:inherit"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="968" height="662" rx="16" class="card" stroke-width="1.5"/>

  <text x="490" y="28" text-anchor="middle" class="note" font-size="13.5">
    任意两个处于无线电通信范围内的节点都通过 LoRa 直接连接——网络是扁平的，没有唯一的必经中介
  </text>

  <!-- 客户端链之间的水平 LoRa 连接 -->
  <text x="235" y="186" text-anchor="middle" class="link-label" font-size="13" font-weight="600">LoRa</text>

  <text x="485" y="186" text-anchor="middle" class="link-label" font-size="13" font-weight="600">LoRa</text>

  <text x="735" y="186" text-anchor="middle" class="link-label" font-size="13" font-weight="600">LoRa</text>

  <!-- 垂直 LoRa 连接：CLIENT_BASE -> ROUTER -->
  <text x="628" y="292" class="link-label" font-size="13" font-weight="600">LoRa</text>

  <!-- 连接：ROUTER -> 互联网 -->
  <text x="723" y="366" text-anchor="middle" class="link-label" font-size="12.5" font-weight="600">互联网上行链路</text>

  <!-- 节点：CLIENT (1) -->
  <circle cx="110" cy="200" r="42" class="client"/>
  <text x="110" y="206" text-anchor="middle" class="node-label" font-size="14">CLIENT</text>

  <!-- 节点：CLIENT (2) -->
  <circle cx="360" cy="200" r="42" class="client"/>
  <text x="360" y="206" text-anchor="middle" class="node-label" font-size="14">CLIENT</text>

  <!-- CLIENT_BASE 的可选互联网上行链路（不仅限于 ROUTER）——连接长度现在与下方
       ROUTER -> 互联网 的连接相当，而不是紧贴在顶部说明文字下方 -->
  <g class="cloud" opacity="0.9">
    <ellipse cx="590" cy="48" rx="10" ry="6.5"/>
    <ellipse cx="606" cy="48" rx="10" ry="6.5"/>
    <ellipse cx="598" cy="42" rx="12" ry="7.5"/>
  </g>
  <text x="618" y="52" class="link-label" font-size="10" font-weight="600">互联网上行链路（可选）</text>

  <!-- 节点：CLIENT_BASE -->
  <rect x="568" y="158" width="84" height="84" rx="14" class="base"/>
  <text x="610" y="197" text-anchor="middle" class="node-label" font-size="13">CLIENT</text>
  <text x="610" y="213" text-anchor="middle" class="node-label" font-size="13">_BASE</text>

  <!-- 节点：技术节点（无头设备，无 PC 或应用 —— 见 Technology.md 第 1 节） -->
  <circle cx="860" cy="200" r="42" class="tech"/>
  <text x="860" y="197" text-anchor="middle" class="node-label" font-size="13">技术</text>
  <text x="860" y="213" text-anchor="middle" class="node-label" font-size="13">节点</text>
  <text x="860" y="260" text-anchor="middle" class="sub-label" font-size="11">(TRACKER / SENSOR / …)</text>

  <!-- 节点：ROUTER / ROUTER_LATE（三角形） -->
  <polygon points="610,336 566,418 654,418" class="router"/>
  <text x="610" y="400" text-anchor="middle" class="node-label" font-size="12">ROUTER</text>
  <text x="610" y="445" text-anchor="middle" class="sub-label" font-size="11">/ ROUTER_LATE</text>

  <!-- 节点：互联网 / 其他网络分段（云朵） -->
  <g class="cloud">
    <ellipse cx="828" cy="388" rx="34" ry="21"/>
    <ellipse cx="892" cy="388" rx="34" ry="21"/>
    <ellipse cx="860" cy="370" rx="42" ry="26"/>
    <rect x="800" y="382" width="120" height="28" rx="14"/>
  </g>
  <text x="860" y="392" text-anchor="middle" class="node-label" font-size="11">互联网</text>
  <text x="860" y="445" text-anchor="middle" class="sub-label" font-size="11">MQTT 桥接其他城市</text>
  <text x="860" y="462" text-anchor="middle" class="note" font-size="9.5">互联网来自附近的电脑/笔记本，</text>
  <text x="860" y="474" text-anchor="middle" class="note" font-size="9.5">不一定是设备本身</text>

  <!-- 图例：单列，纵向留白充足 -->
  <g font-size="12.5">
    <circle cx="40" cy="502" r="9" class="client"/>
    <text x="62" y="506" class="legend-text">客户端设备 — CLIENT / CLIENT_MUTE / CLIENT_HIDDEN</text>

    <rect x="31" y="526" width="18" height="18" rx="4" class="base"/>
    <text x="62" y="540" class="legend-text">CLIENT_BASE — 本地缓存节点（"据点"），提供补收服务；可选作为互联网网关</text>

    <polygon points="40,550 31,568 49,568" class="router"/>
    <text x="62" y="564" class="legend-text">ROUTER / ROUTER_LATE — 基础设施中继节点，扩大无线覆盖范围</text>

    <g class="cloud">
      <ellipse cx="33" cy="590" rx="9" ry="6"/>
      <ellipse cx="47" cy="590" rx="9" ry="6"/>
      <ellipse cx="40" cy="585" rx="11" ry="7"/>
      <rect x="29" y="589" width="22" height="8" rx="4"/>
    </g>
    <text x="62" y="596" class="legend-text">互联网上行链路 — MQTT 桥接其他网络分段（城市）</text>

    <rect x="31" y="628" width="18" height="18" rx="4" class="tech"/>
    <text x="62" y="642" class="legend-text">技术节点（无头设备） — TRACKER / SENSOR / TAK / TAK_TRACKER / LOST_AND_FOUND / REPEATER — 无 PC、无应用</text>
  </g>

  <!-- 连接线放在最后绘制，覆盖在已绘制的节点之上——否则节点形状会在连接处遮挡箭头。 -->
  <line x1="152" y1="200" x2="318" y2="200" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="402" y1="200" x2="568" y2="200" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="652" y1="200" x2="818" y2="200" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="610" y1="242" x2="610" y2="334" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="662" y1="380" x2="784" y2="380" class="link" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="598" y1="152" x2="598" y2="60" class="link" stroke-width="2" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
