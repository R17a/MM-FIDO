<svg viewBox="0 0 1040 764" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .card { fill:#f7f8fa; stroke:#d7dbe0; }
    .panel { fill:#ffffff; stroke:#d7dbe0; }
    .box { fill:#ffffff; stroke:#c2c8d0; }
    .box-dash { fill:#ffffff; stroke:#c2c8d0; stroke-dasharray:5 4; }
    .hdr { fill:#2f6fed; font-weight:700; }
    .title { fill:#3a4150; font-weight:700; }
    .t { fill:#3a4150; }
    .mono { fill:#0f766e; font-family:'Consolas','SF Mono',monospace; }
    .note { fill:#5b6472; font-style:italic; }
    .line { stroke:#14b8a6; fill:none; stroke-width:2; }
    .arrowhead { fill:#14b8a6; }
    @media (prefers-color-scheme: dark) {
      .card { fill:#1b1e24; stroke:#383d46; }
      .panel { fill:#1b1e24; stroke:#383d46; }
      .box { fill:#22262e; stroke:#3c424c; }
      .box-dash { fill:#22262e; stroke:#3c424c; stroke-dasharray:5 4; }
      .hdr { fill:#4f8cff; }
      .title { fill:#c7cdd6; }
      .t { fill:#c7cdd6; }
      .mono { fill:#5eead4; }
      .note { fill:#9aa4b2; }
      .line { stroke:#2dd4bf; }
      .arrowhead { fill:#2dd4bf; }
    }
    text { font-size:14px; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1028" height="752" rx="16" class="card" stroke-width="1.5"/>
  <text x="520" y="34" text-anchor="middle" class="title" font-size="17">Echo-area catalog: global + regional, geo-filtered subscription</text>

  <!-- ================= Panel A: echo-area types ================= -->
  <rect x="24" y="56" width="324" height="484" rx="12" class="panel" stroke-width="1.5"/>
  <text x="186" y="82" text-anchor="middle" class="hdr" font-size="15">Echo-area types</text>

  <rect x="40" y="100" width="292" height="150" rx="9" class="box"/>
  <text x="56" y="124" class="title">Global</text>
  <text x="56" y="150" class="mono" font-size="13">SYS.ANNOUNCE · SYS.*</text>
  <text x="56" y="172" class="mono" font-size="13">EN.TALK · RU.TALK</text>
  <text x="56" y="192" class="t" font-size="12.5">(two-segment — language prefix,</text>
  <text x="56" y="210" class="t" font-size="12.5">not geography)</text>
  <text x="56" y="234" class="note" font-size="12.5">subscribed by default,</text>
  <text x="56" y="250" class="note" font-size="12.5">carried by every node</text>

  <rect x="40" y="272" width="292" height="230" rx="9" class="box"/>
  <text x="56" y="296" class="title">Regional</text>
  <text x="56" y="322" class="t" font-size="13">name format:</text>
  <text x="56" y="342" class="mono" font-size="13">COUNTRY.REGION.TOPIC</text>
  <text x="56" y="374" class="mono" font-size="13">RU.MSK.TALK</text>
  <text x="56" y="396" class="mono" font-size="13">RU.SPB.TALK</text>
  <text x="56" y="418" class="mono" font-size="13">DE.BER.MEET</text>
  <text x="56" y="450" class="note" font-size="12.5">2 geo levels — like the echo</text>
  <text x="56" y="466" class="note" font-size="12.5">tags of classic FidoNet;</text>
  <text x="56" y="486" class="note" font-size="12.5">geo metadata lives on the echo record</text>

  <!-- ================= Panel B: subscription ================= -->
  <rect x="360" y="56" width="352" height="484" rx="12" class="panel" stroke-width="1.5"/>
  <text x="536" y="82" text-anchor="middle" class="hdr" font-size="15">Subscription — key S, a cascade of 2 requests</text>

  <rect x="376" y="98" width="320" height="96" rx="9" class="box"/>
  <text x="392" y="120" class="title" font-size="13.5">1. Request the index</text>
  <text x="392" y="142" class="mono" font-size="12">REQ_AREA_LIST {want: "geo_index"}</text>
  <text x="392" y="164" class="t" font-size="12.5">countries → regions, tens of short</text>
  <text x="392" y="181" class="t" font-size="12.5">lines, WITHOUT regional echo names</text>

  <line x1="536" y1="196" x2="536" y2="209" class="line" marker-end="url(#arrow)"/>
  <text x="536" y="222" text-anchor="middle" class="t" font-size="12.5">pick: Country ▸ Region (or "— all —")</text>

  <rect x="376" y="228" width="320" height="96" rx="9" class="box"/>
  <text x="392" y="250" class="title" font-size="13.5">2. Request the list for the chosen place</text>
  <text x="392" y="272" class="mono" font-size="12">REQ_AREA_LIST {pick: {RU, MSK}}</text>
  <text x="392" y="294" class="t" font-size="12.5">echo names for that place ONLY</text>
  <text x="392" y="311" class="t" font-size="12.5">(region empty → the whole country)</text>

  <line x1="536" y1="326" x2="536" y2="339" class="line" marker-end="url(#arrow)"/>
  <text x="536" y="352" text-anchor="middle" class="t" font-size="12.5">tick the boxes → +AREA (%JOIN)</text>

  <rect x="376" y="358" width="320" height="86" rx="9" class="box-dash"/>
  <text x="536" y="382" text-anchor="middle" class="note" font-size="12.5">≈ 600 bytes over LoRa regardless</text>
  <text x="536" y="400" text-anchor="middle" class="note" font-size="12.5">of network size</text>
  <text x="536" y="424" text-anchor="middle" class="note" font-size="12.5">(was ≈ 6 KB for a 200-echo catalog)</text>

  <text x="536" y="474" text-anchor="middle" class="t" font-size="12.5">global echoes aren't shown here — they are</text>
  <text x="536" y="491" text-anchor="middle" class="t" font-size="12.5">already subscribed. A lone infra node browses</text>
  <text x="536" y="508" text-anchor="middle" class="t" font-size="12.5">its OWN DB; a flat CLIENT with no hub</text>
  <text x="536" y="525" text-anchor="middle" class="t" font-size="12.5">nearby — the dialog is blocked</text>

  <!-- ================= Panel C: which catalog a node carries ================= -->
  <rect x="724" y="56" width="292" height="484" rx="12" class="panel" stroke-width="1.5"/>
  <text x="870" y="82" text-anchor="middle" class="hdr" font-size="15">Which catalog a node carries</text>

  <rect x="740" y="100" width="260" height="96" rx="9" class="box"/>
  <text x="756" y="122" class="title" font-size="13.5">Node / hub WITH internet</text>
  <text x="756" y="146" class="t" font-size="12.5">serves and replicates</text>
  <text x="756" y="164" class="t" font-size="12.5">the FULL catalog — all regions</text>
  <text x="756" y="184" class="note" font-size="12">echo_regions = None (filter off)</text>

  <rect x="740" y="216" width="260" height="120" rx="9" class="box"/>
  <text x="756" y="238" class="title" font-size="13.5">LoRa-only node</text>
  <text x="756" y="262" class="t" font-size="12.5">global + its own regions from</text>
  <text x="756" y="280" class="mono" font-size="12">config.json → echo_regions</text>
  <text x="756" y="298" class="t" font-size="12.5">(first-run wizard step)</text>
  <text x="756" y="322" class="note" font-size="12">empty → global echoes only</text>

  <rect x="740" y="356" width="260" height="96" rx="9" class="box"/>
  <text x="756" y="378" class="title" font-size="13.5">CLIENT_BASE without internet</text>
  <text x="756" y="402" class="t" font-size="12.5">full replication of its own</text>
  <text x="756" y="420" class="t" font-size="12.5">region + global only</text>
  <text x="756" y="440" class="note" font-size="12">whatever it subscribes to is pulled too</text>

  <text x="870" y="480" text-anchor="middle" class="note" font-size="12">a distant region is reachable only</text>
  <text x="870" y="496" text-anchor="middle" class="note" font-size="12">via a hub that carries those echoes</text>
  <text x="870" y="512" text-anchor="middle" class="note" font-size="12">(usually an internet hub)</text>

  <!-- ================= Bottom strip: echo creation ================= -->
  <rect x="24" y="556" width="992" height="192" rx="12" class="box" stroke-width="1.5"/>
  <text x="44" y="582" class="hdr" font-size="15">Creating an echo area — not from dialog S</text>
  <text x="44" y="610" class="t">The subscribe dialog cannot create an echo — the user <tspan class="title">ONLY subscribes</tspan>.</text>
  <text x="44" y="636" class="t">New echo: a signed request by personal mail (NETMAIL) to the root node → manual operator approval →</text>
  <text x="44" y="662" class="t">the signed record spreads across the network by ordinary sync. The AreaFix server lists only approved</text>
  <text x="44" y="688" class="t">echoes in the catalog; private local echoes stay out of the shared catalog.</text>
  <text x="44" y="716" class="t">Moderation (freeze an echo, retract a message, block an author) — the same root-signed records,</text>
  <text x="44" y="738" class="t">applied on receipt; there is no physical deletion. <tspan class="note">[in progress]</tspan></text>
</svg>
