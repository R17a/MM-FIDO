<svg viewBox="0 0 1040 764" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <style>
    .card { fill:#f7f8fa; stroke:#d7dbe0; }
    .panel { fill:#ffffff; stroke:#d7dbe0; }
    .box { fill:#ffffff; stroke:#c2c8d0; }
    .box-dash { fill:#ffffff; stroke:#c2c8d0; stroke-dasharray:5 4; }
    .hdr { fill:#2f6fed; font-weight:700; }
    .title { fill:#3a4150; font-weight:700; }
    .t { fill:#3a4150; }
    .mono { fill:#0f766e; font-family:'Consolas','SF Mono',monospace; }
    .note { fill:#5b6472; font-style:italic; }
    .line { stroke:#14b8a6; fill:none; stroke-width:2; }
    .arrowhead { fill:#14b8a6; }
    @media (prefers-color-scheme: dark) {
      .card { fill:#1b1e24; stroke:#383d46; }
      .panel { fill:#1b1e24; stroke:#383d46; }
      .box { fill:#22262e; stroke:#3c424c; }
      .box-dash { fill:#22262e; stroke:#3c424c; stroke-dasharray:5 4; }
      .hdr { fill:#4f8cff; }
      .title { fill:#c7cdd6; }
      .t { fill:#c7cdd6; }
      .mono { fill:#5eead4; }
      .note { fill:#9aa4b2; }
      .line { stroke:#2dd4bf; }
      .arrowhead { fill:#2dd4bf; }
    }
    text { font-size:14px; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1028" height="752" rx="16" class="card" stroke-width="1.5"/>
  <text x="520" y="34" text-anchor="middle" class="title" font-size="17">信区目录：全局 + 区域，按地理过滤订阅</text>

  <!-- ================= 面板 A：信区类型 ================= -->
  <rect x="24" y="56" width="324" height="484" rx="12" class="panel" stroke-width="1.5"/>
  <text x="186" y="82" text-anchor="middle" class="hdr" font-size="15">信区类型</text>

  <rect x="40" y="100" width="292" height="150" rx="9" class="box"/>
  <text x="56" y="124" class="title">全局</text>
  <text x="56" y="150" class="mono" font-size="13">SYS.ANNOUNCE · SYS.*</text>
  <text x="56" y="172" class="mono" font-size="13">EN.TALK · RU.TALK</text>
  <text x="56" y="192" class="t" font-size="12.5">（两段式——语言前缀，</text>
  <text x="56" y="210" class="t" font-size="12.5">而非地理）</text>
  <text x="56" y="234" class="note" font-size="12.5">默认已订阅，</text>
  <text x="56" y="250" class="note" font-size="12.5">所有节点都携带</text>

  <rect x="40" y="272" width="292" height="230" rx="9" class="box"/>
  <text x="56" y="296" class="title">区域</text>
  <text x="56" y="322" class="t" font-size="13">名称格式：</text>
  <text x="56" y="342" class="mono" font-size="13">国家.地区.主题</text>
  <text x="56" y="374" class="mono" font-size="13">RU.MSK.TALK</text>
  <text x="56" y="396" class="mono" font-size="13">RU.SPB.TALK</text>
  <text x="56" y="418" class="mono" font-size="13">DE.BER.MEET</text>
  <text x="56" y="450" class="note" font-size="12.5">2 个地理层级——如经典</text>
  <text x="56" y="466" class="note" font-size="12.5">FidoNet 的信区标签；</text>
  <text x="56" y="486" class="note" font-size="12.5">地理元数据存于信区记录</text>

  <!-- ================= 面板 B：订阅 ================= -->
  <rect x="360" y="56" width="352" height="484" rx="12" class="panel" stroke-width="1.5"/>
  <text x="536" y="82" text-anchor="middle" class="hdr" font-size="15">订阅——S 键，两次请求的级联</text>

  <rect x="376" y="98" width="320" height="96" rx="9" class="box"/>
  <text x="392" y="120" class="title" font-size="13.5">1. 请求目录索引</text>
  <text x="392" y="142" class="mono" font-size="12">REQ_AREA_LIST {want: "geo_index"}</text>
  <text x="392" y="164" class="t" font-size="12.5">国家 → 地区，数十行短字符串，</text>
  <text x="392" y="181" class="t" font-size="12.5">不含区域信区名称</text>

  <line x1="536" y1="196" x2="536" y2="209" class="line" marker-end="url(#arrow)"/>
  <text x="536" y="222" text-anchor="middle" class="t" font-size="12.5">选择：国家 ▸ 地区（或「— 全部 —」）</text>

  <rect x="376" y="228" width="320" height="96" rx="9" class="box"/>
  <text x="392" y="250" class="title" font-size="13.5">2. 请求所选地点的列表</text>
  <text x="392" y="272" class="mono" font-size="12">REQ_AREA_LIST {pick: {RU, MSK}}</text>
  <text x="392" y="294" class="t" font-size="12.5">仅该地点的信区名称</text>
  <text x="392" y="311" class="t" font-size="12.5">（地区留空 → 整个国家）</text>

  <line x1="536" y1="326" x2="536" y2="339" class="line" marker-end="url(#arrow)"/>
  <text x="536" y="352" text-anchor="middle" class="t" font-size="12.5">勾选 → +AREA (%JOIN)</text>

  <rect x="376" y="358" width="320" height="86" rx="9" class="box-dash"/>
  <text x="536" y="382" text-anchor="middle" class="note" font-size="12.5">≈ 600 字节 LoRa 流量，</text>
  <text x="536" y="400" text-anchor="middle" class="note" font-size="12.5">与网络规模无关</text>
  <text x="536" y="424" text-anchor="middle" class="note" font-size="12.5">（原为 200 个信区 ≈ 6 KB）</text>

  <text x="536" y="474" text-anchor="middle" class="t" font-size="12.5">对话框不显示全局信区——它们本就</text>
  <text x="536" y="491" text-anchor="middle" class="t" font-size="12.5">已订阅。单独的基础设施节点浏览自己的</text>
  <text x="536" y="508" text-anchor="middle" class="t" font-size="12.5">数据库；附近无 HUB 的扁平 CLIENT——</text>
  <text x="536" y="525" text-anchor="middle" class="t" font-size="12.5">对话框被禁用</text>

  <!-- ================= 面板 C：各节点携带哪份目录 ================= -->
  <rect x="724" y="56" width="292" height="484" rx="12" class="panel" stroke-width="1.5"/>
  <text x="870" y="82" text-anchor="middle" class="hdr" font-size="15">各节点携带哪份目录</text>

  <rect x="740" y="100" width="260" height="96" rx="9" class="box"/>
  <text x="756" y="122" class="title" font-size="13.5">有互联网的节点 / HUB</text>
  <text x="756" y="146" class="t" font-size="12.5">提供并复制</text>
  <text x="756" y="164" class="t" font-size="12.5">完整目录——所有地区</text>
  <text x="756" y="184" class="note" font-size="12">echo_regions = None（过滤关闭）</text>

  <rect x="740" y="216" width="260" height="120" rx="9" class="box"/>
  <text x="756" y="238" class="title" font-size="13.5">仅 LoRa 的节点</text>
  <text x="756" y="262" class="t" font-size="12.5">global + 来自</text>
  <text x="756" y="280" class="mono" font-size="12">config.json → echo_regions</text>
  <text x="756" y="298" class="t" font-size="12.5">的自有地区（首次向导步骤）</text>
  <text x="756" y="322" class="note" font-size="12">留空 → 仅 global 信区</text>

  <rect x="740" y="356" width="260" height="96" rx="9" class="box"/>
  <text x="756" y="378" class="title" font-size="13.5">无互联网的 CLIENT_BASE</text>
  <text x="756" y="402" class="t" font-size="12.5">仅完整复制自有</text>
  <text x="756" y="420" class="t" font-size="12.5">地区 + global</text>
  <text x="756" y="440" class="note" font-size="12">所订阅的内容也会拉取</text>

  <text x="870" y="480" text-anchor="middle" class="note" font-size="12">远方地区只能通过</text>
  <text x="870" y="496" text-anchor="middle" class="note" font-size="12">携带这些信区的 HUB 获取</text>
  <text x="870" y="512" text-anchor="middle" class="note" font-size="12">（通常是有互联网的 HUB）</text>

  <!-- ================= 底部条：创建信区 ================= -->
  <rect x="24" y="556" width="992" height="192" rx="12" class="box" stroke-width="1.5"/>
  <text x="44" y="582" class="hdr" font-size="15">创建信区——不在 S 对话框内</text>
  <text x="44" y="610" class="t">订阅对话框无法创建信区——用户<tspan class="title">只能订阅</tspan>。</text>
  <text x="44" y="636" class="t">新信区：以私信（NETMAIL）向根节点发送签名申请 → 操作员手动批准 →</text>
  <text x="44" y="662" class="t">签名记录经普通同步在网络中扩散。AreaFix 服务器目录中只列出已批准的信区；</text>
  <text x="44" y="688" class="t">私有本地信区不进入共享目录。</text>
  <text x="44" y="716" class="t">审核（冻结信区、撤回消息、封禁作者）——同样的根签名记录，在接收时应用；</text>
  <text x="44" y="738" class="t">不存在物理删除。<tspan class="note">[进行中]</tspan></text>
</svg>
